name: Pages

on:
  push:
    branches:
      - 'main'
      - 'master'

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Cleanup to free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: false
          haskell: false
          large-packages: false
          docker-images: false
          swap-storage: false

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render roadmap with Quarto to _site/roadmap
        shell: bash
        run: bash .tinytau/scripts/build-roadmap.sh

      - name: Copy root pages to _site
        shell: bash
        run: |
          mkdir -p _site
          cp -r .tinytau/page/. _site/

      - name: Build Lean project
        uses: leanprover/lean-action@v1

      - name: Build API documentation
        uses: leanprover-community/docgen-action@main
        with:
          homepage: _site
          # _site/ is already built above; skip docgen-action's Jekyll page build.
          build-page: false
          api-docs: true
          use-github-cache: true
          deploy: false

      - name: Rewrite roadmap links in API documentation
        shell: bash
        run: python3 .tinytau/scripts/rewrite-doc-links.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
