name: Lean Action

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
        with:
          axiom-audit: "true"
          axiom-audit-allow: "propext,Classical.choice,Quot.sound"
